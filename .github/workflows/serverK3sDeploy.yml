name: Deploy to Server

on:
  push:
    branches: [k3s]

env:
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: mixail.ermin33.fvds.ru:31339/glorbo-backend:${{ github.sha }}
  FRONTEND_IMAGE: mixail.ermin33.fvds.ru:31339/glorbo-frontend:${{ github.sha }}
  SSH_HOST: ${{ secrets.SSH_K3S_HOST }}
  SSH_USERNAME: ${{ secrets.SSH_K3S_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_K3S_PRIVATE_KEY }}
  KUBERNETES_NAMESPACE: glorbo-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Go
        run: |
          cd backend
          go fmt ./...
          go vet ./...
      - name: Lint JS
        run: |
          cd frontend
          npm install
          npm run lint

  build_and_push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY_URL }} -u ${{ secrets.DOCKER_REGISTRY_USERNAME }} --password-stdin

      - name: Build and push backend image
        run: |
          cd backend
          docker build -t $BACKEND_IMAGE .
          docker push $BACKEND_IMAGE

      - name: Build and push frontend image
        run: |
          cd frontend
          docker build -t $FRONTEND_IMAGE .
          docker push $FRONTEND_IMAGE

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Clean old repo and clone branch k3s on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            rm -rf Glorbo
            git clone --branch k3s https://github.com/magnoliAHAH/Glorbo.git

      - name: Deploy backend and frontend to k3s via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd Glorbo/k3s-setup
            # Обновляем образ backend
            sed -i "s|image: mixail.ermin33.fvds.ru:31339/glorbo-backend:.*|image: $BACKEND_IMAGE|" backend-deploy.yaml
            # Обновляем образ frontend
            sed -i "s|image: mixail.ermin33.fvds.ru:31339/glorbo-frontend:.*|image: $FRONTEND_IMAGE|" frontend-deploy.yaml
            # Применяем backend
            kubectl apply -f backend-deploy.yaml -n $KUBERNETES_NAMESPACE
            kubectl rollout status deployment/backend -n $KUBERNETES_NAMESPACE
            # Применяем frontend
            kubectl apply -f frontend-deploy.yaml -n $KUBERNETES_NAMESPACE
            kubectl rollout status deployment/frontend -n $KUBERNETES_NAMESPACE
