server {
    listen 80;
    listen [::]:80;

    server_name mixail.ermin33.fvds.ru www.mixail.ermin33.fvds.ru;
    return 301 https://mixail.ermin33.fvds.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.mixail.ermin33.fvds.ru;
    return 301 https://mixail.ermin33.fvds.ru$request_uri;

    ssl_certificate /etc/letsencrypt/live/mixail.ermin33.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixail.ermin33.fvds.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mixail.ermin33.fvds.ru/chain.pem;

    include snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mixail.ermin33.fvds.ru;
    root /var/www/mixail.ermin33.fvds.ru/html;
    index index.html index.xml;

    ssl_certificate /etc/letsencrypt/live/mixail.ermin33.fvds.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixail.ermin33.fvds.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mixail.ermin33.fvds.ru/chain.pem;

    include snippets/ssl-params.conf;
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
        location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name grafana.mixail.ermin33.fvds.ru;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

